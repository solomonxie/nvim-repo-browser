<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repo Browser</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Plain script tag, not a module import -- fetch()/import() of local files
         is blocked under file://, but a script tag loading a local file works fine.
         data.js must load before main.tsx so window.__REPO_DATA__ is set in time. -->
    <script src="./data.js"></script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
